<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Děkuji za poptávku | DOSTY STÍNĚNÍ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #050b14; color: #e2e8f0; font-family: Inter, sans-serif; padding: 24px; box-sizing: border-box; }
        .card { max-width: 480px; text-align: center; background: #0b132b; border: 1px solid #334155; border-radius: 24px; padding: 40px 32px; }
        .icon { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px; background: rgba(0,153,255,.15); color: #0099ff; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        h1 { color: #fff; font-size: 26px; margin: 0 0 12px; }
        p { color: #cbd5e1; line-height: 1.6; margin: 0 0 28px; }
        a { display: inline-block; background: #0099ff; color: #fff; text-decoration: none; font-weight: 600; padding: 12px 24px; border-radius: 12px; }
        a:hover { background: #0284c7; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fa-solid fa-check"></i></div>
        <h1>Děkuji za poptávku!</h1>
        <p>Vaše zpráva dorazila. Ozvu se vám co nejdříve zpět s návrhem řešení.</p>
        <a href="/">Zpět na web</a>
    </div>
</body>
</html>
